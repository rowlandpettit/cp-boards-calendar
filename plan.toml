[topics.mixed]
title = "Mixed CP + shared"
goal = "Complete today's unique mixed questions across both required banks, review explanations, and clear the dated first-redo allowance. Topic labels below are reading priorities, not restrictions on the mixed question pool."
materials = "PathDojo and ASCP 2025 CP plus shared hematopathology. Personal guide only for gaps; selected CP Anki through the day."
links = ["dojo", "ascp_cp", "ascp_heme", "blueprint"]

[topics.redo]
title = "First-miss review"
goal = "No required new questions. Redo the remaining first-pass misses closed-book without selecting the same already-cleared questions repeatedly. Review the explanation, then log first-redo completion and repeat misses separately."
materials = "Private first-miss ledger and the original PathDojo/ASCP question histories; targeted guide sections."
links = ["dojo", "ascp_cp", "ascp_heme"]

[topics.baseline]
title = "Mixed baseline"
goal = "Answer a fresh mixed CP set without references. Record confidence, review time and gap type; this is a starting sample, not a pass prediction."
materials = "PathDojo CP plus relevant shared AP/CP categories; selected Ankoma after review."
links = ["dojo", "blueprint"]

[topics.transfusion]
title = "Transfusion"
goal = "Practice compatibility and antibody panels, components, reactions, donors, HLA and cellular therapy. Work through interpretations before revealing answers."
materials = "PathDojo and ASCP; Blood Bank Guy or the personal guide only for specific gaps."
links = ["dojo", "bbguy", "ascp"]

[topics.heme]
title = "Heme + coag"
goal = "Practice benign and neoplastic hematology, coagulation algorithms, smears, flow plots and molecular associations. Describe findings before reading the interpretation."
materials = "PathDojo including shared hematopathology; Remedial Hematopathology 2026 slides; selected CP Ankoma."
links = ["dojo", "ascp"]

[topics.chemistry]
title = "Chemistry"
goal = "Practice analytical methods, QC, acid-base and electrolyte interpretation, endocrine testing, toxicology, immunology and body fluids. Work calculations rather than recognizing formulas."
materials = "PathDojo and ASCP chemistry questions; targeted current reference reading."
links = ["dojo", "ascp", "primer"]

[topics.micro]
title = "Microbiology"
goal = "Practice organism identification, test selection and interpretation, susceptibility principles and practical images. Use current terminology."
materials = "PathDojo; targeted Morgan 2026 material; selected Ankoma or familiar Sketchy Micro cards, without duplicating entire decks."
links = ["dojo", "morgan"]

[topics.management]
title = "Mixed + weekly reset"
goal = "Include management, informatics, molecular methods and calculations. Review the week's recurring gaps and choose next week's priorities without dropping any core domain."
materials = "Mixed PathDojo with management, informatics and molecular categories included; official blueprint. ASCP's selected CP pool does not have a separate management group."
links = ["dojo", "blueprint"]

[topics.consolidate]
title = "Consolidate gaps"
goal = "Revisit repeat misses and explain the underlying concepts without relying on remembered answer choices. Prioritize practical figures, calculations and a short final-review list. No third full bank."
materials = "Repeat misses from PathDojo and ASCP; flagged practical figures and calculations; manageable CP Anki reviews. No third full bank."
links = ["ascp", "abpath"]

[topics.timed]
title = "Timed mixed practice"
goal = "Practice one 55-question mixed block in 66 minutes without references. Use the remaining time for priority misses; carry unresolved explanations into the next review session."
materials = "Mixed CP and shared-topic repeat practice from PathDojo. Label the score as repeated-question pacing practice, not a fresh readiness measure."
links = ["dojo", "ascp", "abpath"]

[topics.light]
title = "Light final review"
goal = "Keep review brief and familiar: a few formulas, figures and recurring errors. No new broad resource. Confirm logistics and protect rest; the unused part of this block is optional."
materials = "Short final-review list and familiar cards; official tutorial if not already completed."
links = ["abpath"]

