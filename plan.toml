[strategy]
objective = "Prepare for the October 19 CP-only primary examination through question practice, targeted explanations, practical interpretation and spaced recall."
scope = "CP-only ABPath certification, not AP boards or Step/USMLE. Questions with explanation review, delayed redos and practical laboratory interpretation drive the plan. Sketchy Path/Pharm are selective foundation support; do not let broad clinical treatment videos displace transfusion, methods/QC, chemistry, heme, diagnostic microbiology or management. Reading every page and activating every card are not required."
review_rule = "Morning study starts Friday September 18. Review explanations immediately for wrong and uncertain correct answers. From Sunday September 20, reserve 10 first redos daily from questions at least two days old, prioritizing recurring gaps; this does not promise every miss a two-day redo. These 150 early redos leave 508 estimated first redos for October 5-12, 63-64 daily. October 13-16 reserves up to 80 repeat/gap questions daily. Track unique new questions, first redos and repeat misses separately; never count a simulation as a new bank."
anki_rule = "Throughout the day: due selected CP cards first, prioritizing transfusion, heme/coag and chemistry; then selected Sketchy Micro cards matching the evening lessons. Add at most 10-20 useful facts daily only if reviews stay manageable. Do not activate entire overlapping decks. Arinsburg/Jhang cards count as MCQs, not quick Anki reviews."
flexibility = "Targets are provisional. Log actual work privately, review the plan weekly, and change upcoming topics based on fresh performance. Do not stack missed days or treat resource completion as a pass guarantee."
capacity = "The 5-7 AM block is the protected anchor, not the whole day's workload. Starting September 18 leaves 17 first-pass days: 65 new daily September 18-25, then 64 daily September 26-October 4. First-pass work typically needs about 4-5.25 hours for questions, explanations and brief reading at 3-4 minutes per new question and 2-3 per redo. About 2-3.25 additional daytime hours remain unscheduled. Friday is the kickoff; an extended morning was requested but its end time is not confirmed, so only the existing 5-7 AM reservation is published. Measure actual pace September 20. If only two hours are available, the full two-bank target must be replanned; do not substitute less explanation review or sleep."
question_plan = "Two required question banks only: 885 remaining PathDojo questions plus 211 ASCP 2025 questions (157 CP practice and 54 shared hematopathology). Complete 1,096 unique first-pass questions September 18-October 4. Friday kickoff: 53 PathDojo + 9 ASCP CP + 3 shared heme = 65 new, with no first redos yet. The hypothetical 60% miss allowance reserves 531 PathDojo and 127 ASCP first redos, 658 total, by October 12. These are estimates, not actual scores. October 13-16 retains 320 repeat/gap slots including 55 timed questions on October 15; October 17-18 stays light. Earlier September 14-17 morning quotas are cancelled, not added on top of the revised counts."
bank_selection = "Use mixed CP and relevant shared categories each day. PathDojo: Tutorial Mode, New (Unanswered) Questions, all CP plus shared categories in the CP subscription. ASCP: CP Practice Questions for all six CP domains; AP/CP Practice Questions only for AP- Bone Marrow Biopsy and AP- Lymph Node and Spleen. Select Random, not Easiest. Never Select All in the combined AP/CP course. ASCP's CP-only screen excludes these two relevant hematopathology groups."
deduplication = "Bank links open setup pages, not pre-created or date-filtered exams. Create a set only when ready to do it. Record its date, identifier and completed unique questions privately. ASCP's first-use setup did not show an unanswered filter; verify available history/filtering as you work and use the seen-question ledger to avoid counting repeats as new. The 125-question ASCP CP simulation reuses bank content and is optional instead of other repeat practice, not an additional 125 unique questions."
review_capacity = "The 658 first-redo allowance covers 60% of the planned first pass, rounded up per bank. A further 60% miss rate on those redos would require 395 repeat attempts, exceeding the 320-slot final buffer by 75, before uncertainty review. Review actual queue size every Sunday and move repeat work earlier or add daytime capacity if needed. No finite count guarantees readiness. PATHPrimer and Arinsburg/Jhang are targeted references, not third required full banks."
videos = "Separate video block 9-10:30 PM starting Wednesday September 16. Thursday September 17 is exactly five review videos, about 54 minutes, with no extra assigned videos. All 17 Blood Bank Guy teaching-library videos, all seven Morgan pathCast lectures, all 118 Sketchy Micro lessons, three chemistry Path and three monitoring Pharm lessons remain scheduled: 148 distinct videos, 150 assignments and about 40 hours 8 minutes of rounded normal-speed budgets. Last Minute Essentials remains on October 13, 14 and 16. October 15 is now a watch night, not a full catch-up evening; its morning question-review reserve is unchanged. Every watch night remains at most 80 video minutes. October 17-18 stay light. The other 75 selected Path/Pharm lessons remain optional."
rest = "The evening-to-morning gap is only 6.5 hours before wind-down. Stop early where possible; trim optional videos rather than extending the night."
gym = "The 5-7 AM study block intentionally overlaps the separate fitness routine, which stays unchanged. Use familiar audio or recall at the gym when practical; use seated study time for detailed questions, calculations and images. Count actual study completed, not two separate hours for overlapping events."

